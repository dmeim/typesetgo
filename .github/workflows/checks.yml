name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - run: bun install --frozen-lockfile
      - name: Build with isolated fixture configuration
        run: bun run build
        env:
          VITE_CONVEX_URL: https://fixture.invalid
          VITE_CLERK_PUBLISHABLE_KEY: ""
      - name: Typecheck Convex functions
        run: node node_modules/@typescript/native/bin/tsc --project convex/tsconfig.json --noEmit
      - run: bun run lint
      - run: bun run test:run
      - name: Install isolated browser
        run: bunx playwright install --with-deps chromium
      - name: Browser acceptance
        run: bun run test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chromium
